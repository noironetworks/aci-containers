name: CI policy fixtures

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.travis.yml'
      - 'tests/ci/**'
  push:
    branches: [master, mmr-6.1.1]
    paths:
      - '.github/workflows/**'
      - '.travis.yml'
      - 'tests/ci/**'

permissions:
  contents: read

jobs:
  policy:
    name: CI policy fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out policy source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - name: Install policy fixture dependencies
        run: python -m pip install -r tests/ci/requirements.txt 'PyYAML==6.0.2'
      - name: Require discovered policy tests
        run: |
          python - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/ci')
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit('No CI policy tests were discovered')
          print(f'Discovered {count} CI policy tests')
          PYTEST
      - name: Run policy fixtures
        run: python -m unittest discover -s tests/ci -v
