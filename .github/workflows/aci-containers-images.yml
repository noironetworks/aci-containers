name: aci-containers CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('aci-containers-release-{0}', github.ref) || format('aci-containers-tests-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  unit-tests:
    name: aci-containers unit tests
    needs: select-ci-provider
    if: >-
      needs.select-ci-provider.outputs.run-gha == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' &&
        github.event.deleted == false &&
        startsWith(github.ref, 'refs/heads/')))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GOPROXY: "https://proxy.golang.org|https://goproxy.io|direct"
      GOTOOLCHAIN: local
      UT_ARTIFACT_DIR: ut-artifacts

    steps:
      - name: Check out test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/ipam/go.sum

      - name: Build commands and run unit tests
        id: tests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${UT_ARTIFACT_DIR}"
          make goinstall 2>&1 | tee "${UT_ARTIFACT_DIR}/goinstall.log"
          make check TEST_ARGS='-count=1' 2>&1 | tee "${UT_ARTIFACT_DIR}/check.log"

      - name: Summarize unit tests and coverage
        if: always()
        shell: bash
        env:
          UNIT_TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${UT_ARTIFACT_DIR}"
          shopt -s nullglob
          profiles=(covprof-*)
          {
            echo "### aci-containers unit tests"
            echo
            printf 'Tested commit: `%s`\n\n' "${GITHUB_SHA}"
            printf 'Test result: `%s`\n\n' "${UNIT_TEST_RESULT}"
            if ((${#profiles[@]} > 0)); then
              echo '| Coverage profile | Statement coverage |'
              echo '|---|---|'
              for profile in "${profiles[@]}"; do
                report="${UT_ARTIFACT_DIR}/${profile}-summary.txt"
                if go tool cover -func="${profile}" >"${report}" 2>&1; then
                  coverage="$(awk '$1 == "total:" { print $NF }' "${report}")"
                  printf '| `%s` | %s |\n' "${profile}" "${coverage}"
                else
                  printf '| `%s` | Unavailable; see artifact |\n' "${profile}"
                fi
              done
            else
              echo 'No coverage profiles were generated; see the job logs.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload unit test logs and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aci-containers-unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ut-artifacts/
            covprof-*
          if-no-files-found: warn
          retention-days: 14

  select-ci-provider:
    name: Select CI provider
    runs-on: ubuntu-22.04
    outputs:
      run-gha: ${{ steps.selector.outputs.run_gha }}
    steps:
      - name: Check out source configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read CI provider from Travis configuration
        id: selector
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t providers < <(
            awk -F: '$1 ~ /^[[:space:]]*-[[:space:]]*CI_PROVIDER[[:space:]]*$/ {
              value = $2
              gsub(/[[:space:]]/, "", value)
              sub(/#.*/, "", value)
              print value
            }' .travis.yml
          )
          if ((${#providers[@]} != 1)); then
            echo "::error:: .travis.yml must define CI_PROVIDER exactly once"
            exit 1
          fi
          provider="${providers[0]}"
          case "${provider}" in
            gha) run_gha=true ;;
            travis) run_gha=false ;;
            *) echo "::error:: CI_PROVIDER must be 'gha' or 'travis'"; exit 1 ;;
          esac
          echo "run_gha=${run_gha}" >> "${GITHUB_OUTPUT}"

  build-and-publish:
    name: Build and publish images
    needs: select-ci-provider
    if: needs.select-ci-provider.outputs.run-gha == 'true' && github.event_name == 'push' && github.event.deleted == false && github.repository == 'noironetworks/aci-containers' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH || 'mmr-6.1.1' }}
      UPSTREAM_ID: ${{ vars.UPSTREAM_ID }}
      CICD_BRANCH: ${{ vars.CICD_BRANCH || 'mmr-6.1.1' }}
      SKIP_CICD_STATUS: ${{ vars.SKIP_CICD_STATUS || 'true' }}
      CI_ARTIFACT_DIR: ci-artifacts
      DOCKER_BUILDKIT: "1"
      GOPROXY: "https://proxy.golang.org|https://goproxy.io|direct"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and prepare compatibility environment
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tag must have form N.N.N.N"; exit 1;
          }
          [[ "${UPSTREAM_ID}" =~ ^[0-9a-f]+$ ]] || {
            echo "::error::UPSTREAM_ID must be a lowercase hex id"; exit 1;
          }
          [[ "${SKIP_CICD_STATUS}" == "true" || "${SKIP_CICD_STATUS}" == "false" ]] || {
            echo "::error::SKIP_CICD_STATUS must be true or false"; exit 1;
          }
          git fetch --force --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" == "tag" ]] || {
            echo "::error::Release tag must be annotated"; exit 1;
          }
          commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          [[ "${commit}" == "$(git rev-parse HEAD)" ]] || {
            echo "::error::Release tag moved after this run was queued"; exit 1;
          }
          [[ "${commit}" == "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")" ]] || {
            echo "::error::Release tag must point to current ${SOURCE_BRANCH} head"; exit 1;
          }
          {
            echo "TRAVIS_TAG=${GITHUB_REF_NAME}"
            echo "TRAVIS_COMMIT=${commit}"
            echo "TRAVIS_BUILD_NUMBER=${GITHUB_RUN_NUMBER}"
            echo "TRAVIS_REPO_SLUG=${GITHUB_REPOSITORY}"
            echo "TRAVIS_JOB_WEB_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "GHA_TRIGGER_TAG=${GITHUB_REF_NAME}"
            echo "GHA_DATE_TAG=$(date -u +%m%d%y)"
            echo "DOCKER_CONFIG=${RUNNER_TEMP}/aci-docker-config"
            echo "QUAY_NOIRO_DOCKER_CONFIG=${RUNNER_TEMP}/aci-quay-noiro-docker-config"
          } >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install release tooling and clone CICD scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install pyyaml pytz
          if [[ "${SKIP_CICD_STATUS}" == "false" ]]; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sudo sh -s -- -b /usr/local/bin
          fi
          cicd_dir="${RUNNER_TEMP}/cicd"
          git clone --depth=1 --single-branch --branch "${CICD_BRANCH}" \
            https://github.com/noironetworks/cicd.git "${cicd_dir}"
          cicd_release="$(sed -nE 's/^RELEASE_TAG="([^"]+)"/\1/p' "${cicd_dir}/travis/globals.sh")"
          [[ "${cicd_release}" == "${TRAVIS_TAG}" ]] || {
            echo "::error::CICD release ${cicd_release} does not match ${TRAVIS_TAG}"; exit 1;
          }
          echo "CICD_DIR=${cicd_dir}" >> "${GITHUB_ENV}"

      - name: Authenticate to image registries
        shell: bash
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_NOIROLABS_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_NOIROLABS_TOKEN }}
          QUAY_NOIRO_USERNAME: ${{ secrets.QUAY_NOIRO_USERNAME }}
          QUAY_NOIRO_TOKEN: ${{ secrets.QUAY_NOIRO_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_NOIRO_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_NOIRO_TOKEN }}
        run: |
          set -Eeuo pipefail
          : "${QUAY_USERNAME:?}" "${QUAY_TOKEN:?}" "${QUAY_NOIRO_USERNAME:?}" \
            "${QUAY_NOIRO_TOKEN:?}" "${DOCKER_USERNAME:?}" "${DOCKER_TOKEN:?}"
          install -d -m 700 "${DOCKER_CONFIG}" "${QUAY_NOIRO_DOCKER_CONFIG}"
          printf '%s' "${QUAY_TOKEN}" | docker login quay.io \
            --username "${QUAY_USERNAME}" --password-stdin
          printf '%s' "${DOCKER_TOKEN}" | docker login docker.io \
            --username "${DOCKER_USERNAME}" --password-stdin
          printf '%s' "${QUAY_NOIRO_TOKEN}" | DOCKER_CONFIG="${QUAY_NOIRO_DOCKER_CONFIG}" \
            docker login quay.io --username "${QUAY_NOIRO_USERNAME}" --password-stdin

      - name: Build and publish through shared CICD scripts
        shell: bash
        env:
          TRAVIS_TAGGER: ${{ secrets.GITHUBACTIONS_TAGGER }}
        run: |
          set -Eeuo pipefail
          if [[ "${SKIP_CICD_STATUS}" == "false" ]]; then
            : "${TRAVIS_TAGGER:?GITHUBACTIONS_TAGGER is required for status publication}"
          fi
          mkdir -p "${CI_ARTIFACT_DIR}"
          "${CICD_DIR}/travis/check-git-tag.sh"
          "${CICD_DIR}/travis/build-push-aci-containers-images.sh" \
            2>&1 | tee "${CI_ARTIFACT_DIR}/build-and-publish.log"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aci-containers-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove registry credentials
        if: always()
        shell: bash
        run: |
          rm -f -- "${RUNNER_TEMP}/aci-docker-config/config.json" \
            "${RUNNER_TEMP}/aci-quay-noiro-docker-config/config.json"
